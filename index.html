
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON BALL — Arcade</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  background:
    radial-gradient(circle at 50% 10%, #202b50, #090b17 65%);
  font-family: Segoe UI, sans-serif;
  color: white;
}

.game {
  width: min(900px, 100%);
  padding: 20px;
  background: #101528;
  border: 1px solid #303e68;
  border-radius: 25px;
  box-shadow: 0 20px 70px #000b;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #74d9ff;
  text-shadow: 0 0 15px #259cff;
}

.tag {
  color: #8999c4;
  font-size: 12px;
}

canvas {
  width: 100%;
  display: block;
  border-radius: 17px;
  background: #080e20;
  border: 1px solid #293c67;
  touch-action: none;
  cursor: pointer;
}

.panel {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  min-width: 90px;
  padding: 12px;
  text-align: center;
  background: #1b2542;
  border: 1px solid #35466e;
  border-radius: 13px;
}

.stat small {
  display: block;
  color: #8da0ce;
  font-size: 11px;
  margin-bottom: 5px;
}

.stat strong {
  font-size: 21px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

button, select {
  padding: 12px 17px;
  border-radius: 12px;
  border: 1px solid #526da8;
  background: #263b69;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #385795;
}

button:active {
  transform: scale(.96);
}

select {
  flex: 1;
  min-width: 140px;
}

.primary {
  background: #087fbb;
  border-color: #49caff;
  flex: 2;
}

.hint {
  margin-top: 13px;
  text-align: center;
  color: #8091b9;
  font-size: 12px;
}

@media(max-width: 500px) {
  .game { padding: 12px; }
  .logo { font-size: 19px; }
  .stat { min-width: 75px; padding: 8px; }
}
</style>
</head>
<body>

<div class="game">

  <div class="header">
    <div>
      <div class="logo">NEON BALL</div>
      <div class="tag">ARCADE SURVIVAL SYSTEM · VERSION 0.2</div>
    </div>
    <div>⚡ <span id="difficultyName">NORMAL</span></div>
  </div>

  <canvas id="canvas" width="820" height="480"></canvas>

  <div class="panel">
    <div class="stat">
      <small>🏆 СЧЁТ</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>⭐ РЕКОРД</small>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <small>❤️ ЖИЗНИ</small>
      <strong id="lives">3</strong>
    </div>
    <div class="stat">
      <small>💎 КРИСТАЛЛЫ</small>
      <strong id="gems">0</strong>
    </div>
  </div>

  <div class="controls">
    <select id="difficulty">
      <option value="easy">🟢 Лёгкая</option>
      <option value="normal" selected>🟡 Нормальная</option>
      <option value="hard">🔴 Хардкор</option>
    </select>

    <button class="primary" id="start">▶ НАЧАТЬ</button>
    <button id="pause">⏸ ПАУЗА</button>
    <button id="restart">↻</button>
  </div>

  <div class="hint">
    SPACE / ЗАЖАТЬ МЫШЬ / КАСАНИЕ — ПОДЪЁМ МЯЧА
  </div>

</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const $ = id => document.getElementById(id);

const settings = {
  easy: {
    name: "EASY",
    gravity: .30,
    lift: .85,
    speed: 2.6,
    gap: 155,
    lives: 5
  },
  normal: {
    name: "NORMAL",
    gravity: .42,
    lift: 1.15,
    speed: 3.4,
    gap: 125,
    lives: 3
  },
  hard: {
    name: "HARDCORE",
    gravity: .53,
    lift: 1.35,
    speed: 4.4,
    gap: 105,
    lives: 1
  }
};

let difficulty = "normal";
let config = settings[difficulty];

let ball;
let obstacles = [];
let gems = [];
let particles = [];
let stars = [];

let score = 0;
let best = 0;
let collected = 0;
let lives = 3;

let running = false;
let paused = false;
let gameOver = false;
let started = false;
let pressing = false;

let speed = 3.4;
let spawnTimer = 0;
let frame = 0;
let shield = 0;

const floorY = H - 12;

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function getBest() {
  return Number(localStorage.getItem("neonBest_" + difficulty) || 0);
}

function saveBest() {
  localStorage.setItem("neonBest_" + difficulty, best);
}

function updateUI() {
  $("score").textContent = Math.floor(score);
  $("best").textContent = best;
  $("lives").textContent = lives;
  $("gems").textContent = collected;
  $("difficultyName").textContent = config.name;
}

function makeBall() {
  return {
    x: 140,
    y: floorY - 15,
    vy: 0,
    r: 15,
    squash: 1,
    invincible: 0
  };
}

function resetGame() {
  config = settings[difficulty];

  score = 0;
  collected = 0;
  lives = config.lives;

  speed = config.speed;
  obstacles = [];
  gems = [];
  particles = [];

  spawnTimer = 0;
  frame = 0;
  shield = 0;

  ball = makeBall();

  running = false;
  paused = false;
  gameOver = false;
  started = false;
  pressing = false;

  best = getBest();

  $("pause").textContent = "⏸ ПАУЗА";

  updateUI();
  draw();
}

function startGame() {
  if (gameOver) resetGame();

  running = true;
  started = true;
  paused = false;
}

function createParticles(x, y, color, amount = 12) {
  for (let i = 0; i < amount; i++) {
    particles.push({
      x, y,
      vx: random(-4, 4),
      vy: random(-4, 4),
      life: 1,
      color,
      size: random(2, 5)
    });
  }
}

function spawnObstacle() {
  const gap = Math.max(
    82,
    config.gap - Math.min(25, score / 35)
  );

  const center = random(110, H - 110);
  const width = 21;
  const topHeight = center - gap / 2;
  const bottomY = center + gap / 2;

  obstacles.push({
    x: W + 20,
    w: width,
    top: topHeight,
    bottom: bottomY,
    passed: false
  });

  if (Math.random() < .65) {
    gems.push({
      x: W + 20 + width / 2,
      y: center,
      r: 9,
      phase: random(0, 6)
    });
  }
}

function collisionCircleRect(cx, cy, r, rx, ry, rw, rh) {
  const x = Math.max(rx, Math.min(cx, rx + rw));
  const y = Math.max(ry, Math.min(cy, ry + rh));

  return (cx - x) ** 2 + (cy - y) ** 2 < r * r;
}

function hit() {
  if (ball.invincible > 0 || gameOver) return;

  if (shield > 0) {
    shield = 0;
    ball.invincible = 75;
    createParticles(ball.x, ball.y, "#4deeff", 25);
    return;
  }

  lives--;
  ball.invincible = 100;

  createParticles(ball.x, ball.y, "#ff456b", 25);

  if (lives <= 0) {
    endGame();
  } else {
    ball.vy = -5;
  }

  updateUI();
}

function endGame() {
  running = false;
  gameOver = true;
  pressing = false;

  if (score > best) {
    best = Math.floor(score);
    saveBest();
  }

  updateUI();
}

function update() {
  frame++;

  if (!running || paused || gameOver) return;

  score += .08;
  speed = config.speed + Math.min(3, score / 180);

  if (score > best) {
    best = Math.floor(score);
  }

  // Мяч
  ball.vy += config.gravity;

  if (pressing) {
    ball.vy -= config.lift;
    ball.vy = Math.max(ball.vy, -7);
  }

  ball.y += ball.vy;

  if (ball.y + ball.r > floorY) {
    ball.y = floorY - ball.r;
    ball.vy = -Math.abs(ball.vy) * .78;
    ball.squash = .72;

    if (Math.abs(ball.vy) < .7) ball.vy = 0;
  }

  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.vy = Math.abs(ball.vy) * .4;
  }

  ball.squash += (1 - ball.squash) * .2;

  if (ball.invincible > 0) ball.invincible--;
  if (shield > 0) shield--;

  // Препятствия
  spawnTimer++;

  const interval = Math.max(49, 95 - score / 12);

  if (spawnTimer >= interval) {
    spawnObstacle();
    spawnTimer = 0;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];

    o.x -= speed;

    if (!o.passed && o.x + o.w < ball.x) {
      o.passed = true;
      score += 5;
    }

    const topHit = collisionCircleRect(
      ball.x, ball.y, ball.r,
      o.x, 0, o.w, o.top
    );

    const bottomHit = collisionCircleRect(
      ball.x, ball.y, ball.r,
      o.x, o.bottom, o.w, H - o.bottom
    );

    if (topHit || bottomHit) hit();

    if (o.x + o.w < 0) obstacles.splice(i, 1);
  }

  // Кристаллы
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];

    g.x -= speed;
    g.phase += .08;

    const dy = ball.y - (g.y + Math.sin(g.phase) * 5);
    const dx = ball.x - g.x;

    if (Math.hypot(dx, dy) < ball.r + g.r) {
      collected++;
      score += 15;

      if (collected % 5 === 0) {
        shield = 240;
      }

      createParticles(g.x, g.y, "#ffe46c", 16);
      gems.splice(i, 1);
    } else if (g.x < -20) {
      gems.splice(i, 1);
    }
  }

  // Частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += .08;
    p.life -= .025;

    if (p.life <= 0) particles.splice(i, 1);
  }

  updateUI();
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, W, H);
  gradient.addColorStop(0, "#101a35");
  gradient.addColorStop(1, "#080b19");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Сетка
  ctx.strokeStyle = "#ffffff08";
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Звёзды
  for (let i = 0; i < 45; i++) {
    const x = (i * 173 + frame * .2) % W;
    const y = (i * 79) % H;

    ctx.fillStyle = "#8fcfff55";
    ctx.fillRect(x, y, 2, 2);
  }

  // Пол
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#3a8fff";

  ctx.fillStyle = "#273e73";
  ctx.fillRect(0, floorY, W, 12);

  ctx.shadowBlur = 0;
}

function drawObstacles() {
  for (const o of obstacles) {
    const gradient = ctx.createLinearGradient(o.x, 0, o.x + o.w, 0);

    gradient.addColorStop(0, "#ed315e");
    gradient.addColorStop(.5, "#ff6386");
    gradient.addColorStop(1, "#922344");

    ctx.fillStyle = gradient;
    ctx.shadowColor = "#ff315e";
    ctx.shadowBlur = 17;

    ctx.beginPath();
    ctx.roundRect(o.x, 0, o.w, o.top, 7);
    ctx.fill();

    ctx.beginPath();
    ctx.roundRect(o.x, o.bottom, o.w, H - o.bottom, 7);
    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

function drawGems() {
  for (const g of gems) {
    const y = g.y + Math.sin(g.phase) * 5;

    ctx.save();
    ctx.translate(g.x, y);
    ctx.rotate(Math.PI / 4);

    ctx.shadowColor = "#ffe66d";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ffe66d";
    ctx.fillRect(-7, -7, 14, 14);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-3, -3, 5, 5);

    ctx.restore();
  }
}

function drawBall() {
  if (ball.invincible > 0 && Math.floor(frame / 5) % 2 === 0) return;

  const rx = ball.r * (2 - ball.squash);
  const ry = ball.r * ball.squash;

  ctx.save();

  ctx.shadowColor = shield > 0 ? "#35eaff" : "#4a9fff";
  ctx.shadowBlur = 28;

  const grad = ctx.createRadialGradient(
    ball.x - 6, ball.y - 7, 2,
    ball.x, ball.y, ball.r + 5
  );

  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(.35, "#a6ddff");
  grad.addColorStop(1, "#2470ec");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();

  if (shield > 0) {
    ctx.strokeStyle = "#4deeff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 25 + Math.sin(frame * .2) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = "#050916cc";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";

  ctx.shadowColor = "#359dff";
  ctx.shadowBlur = 25;

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 48px Segoe UI";
  ctx.fillText(title, W / 2, H / 2 - 20);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#a9c6ed";
  ctx.font = "20px Segoe UI";
  ctx.fillText(subtitle, W / 2, H / 2 + 35);

  ctx.textAlign = "left";
}

function draw() {
  drawBackground();
  drawObstacles();
  drawGems();
  drawParticles();
  drawBall();

  if (!started && !gameOver) {
    drawOverlay("NEON BALL", "Нажми НАЧАТЬ, чтобы играть");
  }

  if (paused) {
    drawOverlay("ПАУЗА", "Нажми ПРОБЕЛ или продолжить");
  }

  if (gameOver) {
    drawOverlay("GAME OVER", "Счёт: " + Math.floor(score) + " · Нажми НАЧАТЬ");
  }

  ctx.fillStyle = "#ffffff99";
  ctx.font = "13px Segoe UI";
  ctx.fillText("SPEED " + speed.toFixed(1), W - 115, 25);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Управление
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();

    if (gameOver) return;

    if (!started) startGame();
    else if (paused) {
      paused = false;
      $("pause").textContent = "⏸ ПАУЗА";
    } else pressing = true;
  }
});

window.addEventListener("keyup", e => {
  if (e.code === "Space") pressing = false;
});

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();

  if (!started && !gameOver) startGame();
  if (running && !paused) pressing = true;
});

window.addEventListener("pointerup", () => {
  pressing = false;
});

$("start").addEventListener("click", startGame);

$("restart").addEventListener("click", resetGame);

$("pause").addEventListener("click", () => {
  if (!started || gameOver) return;

  paused = !paused;
  pressing = false;

  $("pause").textContent = paused ? "▶ ПРОДОЛЖИТЬ" : "⏸ ПАУЗА";
});

$("difficulty").addEventListener("change", e => {
  difficulty = e.target.value;
  config = settings[difficulty];
  resetGame();
});

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
    return this;
  };
}

resetGame();
loop();

})();
</script>
</body>
</html>
