<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wall Kickers: Traps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d12; font-family: system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  #ui { position: fixed; top: 16px; left: 16px; color: #fff; pointer-events: none; user-select: none; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #score { font-size: 40px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  #hint { font-size: 13px; opacity: .7; margin-top: 6px; max-width: 280px; }
  #gameover { position: fixed; inset: 0; display: none; place-items: center; background: rgba(5,5,10,.75); backdrop-filter: blur(4px); color: #fff; text-align: center; }
  #gameover.show { display: grid; }
  #gameover h1 { font-size: 46px; margin-bottom: 8px; color: #ff4d6d; }
  #gameover p { opacity: .85; margin-bottom: 22px; font-size: 18px; }
  #restart { padding: 14px 34px; border: 0; border-radius: 999px; background: #ff3d71; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform .15s; }
  #restart:hover { transform: scale(1.06); }
  #toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(255, 61, 113, .9); color: #fff; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 15px; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="hint">Клик / Space — прыжок. ← → — управление. У стены — отскок.</div>
</div>

<div id="toast"></div>

<div id="gameover">
  <div>
    <h1>Ты попал в ловушку!</h1>
    <p>Высота: <span id="finalScore">0</span></p>
    <button id="restart">Заново</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const gameoverEl = document.getElementById('gameover');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restart');
  const toastEl = document.getElementById('toast');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  addEventListener('resize', () => {
    resize();
    if (worldReady) player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  });

  // ---------- Физика ----------
  const GRAVITY = 2100;
  const MOVE_ACCEL = 2600;
  const MOVE_MAX = 320;
  const JUMP_SPEED = 820;
  const WALL_JUMP_X = 480;
  const WALL_JUMP_Y = 780;
  const PLAYER_R = 15;
  const WALL_H = 22;
  const SPIKE_H = 14;

  const STEP_MIN = 70;
  const STEP_MAX = 100;
  const MAX_DX = 140;

  // ---------- Игрок ----------
  const player = {
    x: 0, y: 0, vx: 0, vy: 0, r: PLAYER_R,
    onGround: false, wallDir: 0,
    coyote: 0, jumpBuffer: 0,
    trail: [],
  };

  // ---------- Мир ----------
  let walls, spikes, traps, particles, score, dead, camY, startY, worldReady = false;
  let highestY = 0;
  let checkpoint = { x: 0, y: 0 };
  let fallTimer = 0;
  let lastDeathFromFall = 0;
  let time = 0;

  function rand(min, max) { return min + Math.random() * (max - min); }
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1100);
  }

  function initWorld() {
    walls = [];
    spikes = [];
    traps = []; // ловушки
    particles = [];
    score = 0;
    dead = false;
    camY = 0;
    fallTimer = 0;
    lastDeathFromFall = 0;
    time = 0;
    worldReady = true;

    const startW = Math.min(360, W * 0.65);
    const startX = (W - startW) / 2;
    const startPlatformY = H - 100;
    walls.push({ x: startX, y: startPlatformY, w: startW, h: 400, ground: true });

    player.x = W / 2;
    player.y = startPlatformY - PLAYER_R;
    player.vx = 0;
    player.vy = 0;
    player.onGround = true;
    player.wallDir = 0;
    player.coyote = 0;
    player.jumpBuffer = 0;
    player.trail = [];

    startY = player.y;
    highestY = startPlatformY;
    checkpoint.x = player.x;
    checkpoint.y = player.y;

    generateUpTo(startY - 800);
    generateUpTo(startY - 1600);
    updateScore();
    camY = player.y - H * 0.62;
  }

  function generateUpTo(targetY) {
    while (highestY > targetY) {
      spawnNextPlatform();
    }
  }

  function spawnNextPlatform() {
    const stepY = rand(STEP_MIN, STEP_MAX);
    const y = highestY - stepY;

    const prev = walls.reduce((a, b) => (b.y < a.y ? b : a));
    const prevCenter = prev.x + prev.w / 2;

    const w = rand(110, 180);
    const dir = Math.random() < 0.5 ? -1 : 1;
    let targetCenter = prevCenter + dir * rand(40, MAX_DX);

    const margin = 30;
    targetCenter = Math.max(w / 2 + margin, Math.min(W - w / 2 - margin, targetCenter));

    if (Math.abs(targetCenter - prevCenter) < 50) {
      const dir2 = -dir;
      targetCenter = prevCenter + dir2 * rand(70, MAX_DX);
      targetCenter = Math.max(w / 2 + margin, Math.min(W - w / 2 - margin, targetCenter));
    }

    const x = targetCenter - w / 2;
    
    // Шанс сделать платформу ловушкой (иллюзией)
    const isIllusion = (Math.random() < 0.15 && walls.length > 10);
    const wall = { x, y, w, h: WALL_H, ground: false, illusion: isIllusion, alpha: 1, delay: 0 };
    
    walls.push(wall);
    highestY = y;

    // Обычные шипы
    if (!isIllusion && w >= 140 && Math.random() < 0.2) {
      const side = Math.random() < 0.5 ? 'left' : 'right';
      const sx = side === 'left' ? x + rand(15, 35) : x + w - rand(15, 35) - 18;
      spikes.push({ x: sx, y: y + WALL_H, w: 18, h: SPIKE_H, dir: -1 });
    }

    // === ГЕНЕРАЦИЯ ЛОВУШЕК (только на обычных платформах, начиная с 5-й) ===
    if (!isIllusion && walls.length > 5) {
      const trapRoll = Math.random();
      
      // 1. Скользящие шипы (пила) — 15%
      if (trapRoll < 0.15 && w > 100) {
        traps.push({
          type: 'saw',
          baseX: x + 30,
          x: x + 30,
          y: y - 15, // висит над платформой
          w: 30, h: 15,
          minX: x + 10,
          maxX: x + w - 40,
          speed: 1.5 + Math.random() * 1.5,
          dir: 1,
          time: 0
        });
      } 
      // 2. Падающая сосулька — 10%
      else if (trapRoll < 0.25 && stepY > 80) {
        traps.push({
          type: 'icicle',
          x: x + w / 2, y: y - 150, // висит высоко над платформой
          w: 20, h: 40,
          vy: 0,
          falling: false,
          triggered: false,
          resetY: y - 150
        });
      }
      // 3. Вертикальный лазер — 10%
      else if (trapRoll < 0.35) {
        traps.push({
          type: 'laser',
          x: x + w / 2 - 5, y: y - 250,
          w: 10, h: 250,
          on: false,
          timer: 0,
          interval: 2.5 + Math.random() * 1.5
        });
      }
    }
  }

  // ---------- Ввод ----------
  function doJump() { if (!dead) player.jumpBuffer = 0.14; }
  addEventListener('mousedown', doJump);
  addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); }, { passive: false });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!e.repeat) doJump();
      e.preventDefault();
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  });
  addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });
  const keys = { left: false, right: false };
  restartBtn.addEventListener('click', () => { gameoverEl.classList.remove('show'); initWorld(); });

  // ---------- Респавн ----------
  function respawn() {
    const now = performance.now() / 1000;
    const tooFast = (now - lastDeathFromFall) < 1.2;
    lastDeathFromFall = now;

    if (tooFast) {
      const startWall = walls.find(w => w.ground);
      if (startWall) {
        player.x = startWall.x + startWall.w / 2;
        player.y = startWall.y - PLAYER_R - 1;
      }
    } else {
      player.x = checkpoint.x;
      player.y = checkpoint.y - 2;
    }
    player.vx = 0; player.vy = 0; player.wallDir = 0;
    player.onGround = false; player.coyote = 0; player.jumpBuffer = 0; player.trail = [];
    camY = player.y - H * 0.62;
    spawnParticles(player.x, player.y, 20, '#8ec5ff');
    showToast('Возврат на платформу');
  }

  function die() {
    if (dead) return;
    dead = true;
    spawnParticles(player.x, player.y, 30, '#ff5c8a');
    finalScoreEl.textContent = score;
    gameoverEl.classList.add('show');
  }

  // ---------- Физика и ловушки ----------
  function update(dt) {
    time += dt;
    updateParticles(dt);
    updateTrail(dt);

    if (dead) {
      player.vy += GRAVITY * dt; player.y += player.vy * dt;
      return;
    }

    if (player.onGround || player.wallDir !== 0) player.coyote = 0.1;
    else player.coyote = Math.max(0, player.coyote - dt);
    if (player.jumpBuffer > 0) player.jumpBuffer -= dt;

    let ax = 0;
    if (keys.left) ax -= 1;
    if (keys.right) ax += 1;

    if (player.jumpBuffer > 0) {
      if (player.onGround || player.coyote > 0) {
        player.vy = -JUMP_SPEED; player.onGround = false; player.coyote = 0; player.jumpBuffer = 0;
        spawnParticles(player.x, player.y + player.r, 8, '#8ec5ff');
      } else if (player.wallDir !== 0) {
        player.vy = -WALL_JUMP_Y; player.vx = -player.wallDir * WALL_JUMP_X;
        player.wallDir = 0; player.jumpBuffer = 0;
        spawnParticles(player.x, player.y, 10, '#ff9ecb');
      }
    }

    if (ax !== 0) {
      player.vx += ax * MOVE_ACCEL * dt;
      if (Math.abs(player.vx) > MOVE_MAX) player.vx = Math.sign(player.vx) * MOVE_MAX;
    } else {
      const fr = player.onGround ? 10 : 1.4;
      player.vx *= (1 - fr * dt);
      if (Math.abs(player.vx) < 3) player.vx = 0;
    }

    player.vy += GRAVITY * dt;
    if (player.vy > 2200) player.vy = 2200;

    player.x += player.vx * dt; collideX();
    player.y += player.vy * dt; collideY();

    if (player.x - player.r < 0) { player.x = player.r; if (player.vx < 0) player.vx = -player.vx * 0.6; }
    if (player.x + player.r > W) { player.x = W - player.r; if (player.vx > 0) player.vx = -player.vx * 0.6; }

    // Обновление ловушек
    updateTraps(dt);

    // Чекпоинт
    if (player.onGround) {
      let onSafe = false;
      for (const w of walls) {
        if (Math.abs(player.y + player.r - w.y) < 3 && player.x > w.x + 6 && player.x < w.x + w.w - 6 && !w.illusion) {
          onSafe = true; break;
        }
      }
      if (onSafe) { checkpoint.x = player.x; checkpoint.y = player.y; }
    }

    // Падение
    const fellTooLow = player.y > startY + H + 200;
    const belowCamera = player.y - camY > H * 1.5;
    if (fellTooLow || belowCamera) {
      fallTimer += dt;
      if (fallTimer > 0.15) { fallTimer = 0; respawn(); }
    } else fallTimer = 0;

    // Шипы (обычные)
    for (const s of spikes) if (circleRect(player.x, player.y, player.r, s.x, s.y, s.w, s.h)) die();

    // Проверка ловушек на урон
    for (const t of traps) {
      if (t.type === 'saw' && circleRect(player.x, player.y, player.r, t.x, t.y, t.w, t.h)) die();
      if (t.type === 'icicle' && circleRect(player.x, player.y, player.r, t.x, t.y, t.w, t.h)) die();
      if (t.type === 'laser' && t.on && circleRect(player.x, player.y, player.r, t.x, t.y, t.w, t.h)) die();
    }

    if (player.y - 1600 < highestY) generateUpTo(player.y - 2400);
    updateScore();
    const targetCam = player.y - H * 0.62;
    camY += (targetCam - camY) * Math.min(1, 6 * dt);
  }

  function updateTraps(dt) {
    for (const t of traps) {
      // 1. Пила
      if (t.type === 'saw') {
        t.x += t.speed * t.dir;
        if (t.x > t.maxX) { t.x = t.maxX; t.dir = -1; }
        if (t.x < t.minX) { t.x = t.minX; t.dir = 1; }
      }
      // 2. Сосулька
      if (t.type === 'icicle') {
        if (!t.falling && !t.triggered) {
          // Триггер: игрок под сосулькой и ниже её
          if (player.x > t.x - 40 && player.x < t.x + t.w + 40 && player.y > t.y && player.y < t.y + 300) {
            t.triggered = true;
            spawnParticles(t.x + t.w/2, t.y + t.h, 10, '#fff');
          }
        }
        if (t.triggered && !t.falling) {
          t.vy += GRAVITY * dt; // падает с ускорением
          t.y += t.vy * dt;
          if (t.y > H + camY + 200) t.falling = true; // ушла за экран
        }
      }
      // 3. Лазер
      if (t.type === 'laser') {
        t.timer += dt;
        if (t.on) {
          if (t.timer > 0.6) { t.on = false; t.timer = 0; }
        } else {
          if (t.timer > t.interval) { t.on = true; t.timer = 0; }
        }
      }
    }

    // Иллюзорные платформы
    for (const w of walls) {
      if (w.illusion) {
        if (w.alpha <= 0 && w.delay <= 0) continue; // уже исчезла

        let onIt = false;
        // Если игрок стоит на ней прямо сейчас
        if (Math.abs(player.y + player.r - w.y) < 3 && player.x > w.x - 5 && player.x < w.x + w.w + 5) {
          onIt = true;
        }

        if (onIt) {
          w.delay += dt;
          if (w.delay > 0.4) { // через 0.4 сек исчезает
            w.alpha -= dt * 2;
            if (w.alpha < 0) w.alpha = 0;
          }
        } else if (w.alpha < 1 && w.alpha > 0) {
          w.alpha += dt * 2; // восстанавливается
          if (w.alpha > 1) w.alpha = 1;
          w.delay = 0;
        }
      }
    }
  }

  function collideX() {
    player.wallDir = 0;
    for (const w of walls) {
      if (w.ground || w.alpha <= 0) continue;
      if (!aabb(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, w.x, w.y, w.w, w.h)) continue;
      if (player.vx > 0) { player.x = w.x - player.r; player.wallDir = 1; player.vx = 0; }
      else if (player.vx < 0) { player.x = w.x + w.w + player.r; player.wallDir = -1; player.vx = 0; }
    }
  }

  function collideY() {
    player.onGround = false;
    for (const w of walls) {
      if (w.alpha <= 0) continue;
      if (!aabb(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, w.x, w.y, w.w, w.h)) continue;
      if (player.vy > 0) { player.y = w.y - player.r; player.vy = 0; player.onGround = true; }
      else if (player.vy < 0) { player.y = w.y + w.h + player.r; player.vy = 0; }
    }
  }

  function aabb(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function updateScore() {
    score = Math.max(score, Math.floor((startY - player.y) / 10));
    scoreEl.textContent = score;
  }

  function spawnParticles(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.5 + Math.random() * 0.4, max: 0.9, color, size: 2 + Math.random() * 4 });
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function updateTrail(dt) {
    if (dead) return;
    player.trail.push({ x: player.x, y: player.y, life: 0.3 });
    if (player.trail.length > 16) player.trail.shift();
    for (const t of player.trail) t.life -= dt;
    while (player.trail.length && player.trail[0].life <= 0) player.trail.shift();
  }

  // ---------- Рендер ----------
  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#161a2b'); g.addColorStop(1, '#0b0d16');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save(); ctx.globalAlpha = 0.5;
    for (let i = 0; i < 80; i++) {
      const sx = (i * 137.5) % W;
      const sy = ((i * 89.7 - camY * 0.25) % H + H) % H;
      ctx.fillStyle = i % 3 === 0 ? '#8ec5ff' : '#ffffff';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();

    ctx.save(); ctx.translate(0, -camY);

    // Стены
    for (const w of walls) {
      if (w.y - camY > H + 80 || w.y + w.h - camY < -80) continue;
      if (w.illusion && w.alpha <= 0) continue;
      
      ctx.globalAlpha = w.illusion ? w.alpha : 1;
      
      // Для иллюзий делаем цвет чуть более красноватым, чтобы намекнуть
      const grad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      grad.addColorStop(0, w.ground ? '#3b4a6b' : (w.illusion ? '#6b3b4a' : '#4a5c82'));
      grad.addColorStop(1, w.ground ? '#232c40' : (w.illusion ? '#401d26' : '#2c3550'));
      ctx.fillStyle = grad;
      roundRect(w.x, w.y, w.w, w.h, 8);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(w.x + 3, w.y + 3, w.w - 6, 4, 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Обычные шипы
    for (const s of spikes) {
      if (s.y - camY > H + 40 || s.y + s.h - camY < -40) continue;
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      const count = 3, step = s.w / count;
      for (let i = 0; i < count; i++) {
        const bx = s.x + i * step;
        ctx.moveTo(bx, s.y); ctx.lineTo(bx + step / 2, s.y + s.h); ctx.lineTo(bx + step, s.y);
      }
      ctx.closePath(); ctx.fill();
    }

    // Ловушки
    for (const t of traps) {
      if (t.y - camY > H + 100 || t.y + 100 - camY < -100) continue;

      if (t.type === 'saw') {
        // Рисуем шипастую пилу
        ctx.save();
        ctx.translate(t.x + t.w/2, t.y + t.h/2);
        ctx.rotate(time * 4);
        ctx.fillStyle = '#ff3d71';
        ctx.shadowColor = '#ff3d71'; ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const rOuter = 18;
          const rInner = 12;
          ctx.lineTo(Math.cos(angle) * rOuter, Math.sin(angle) * rOuter);
          ctx.lineTo(Math.cos(angle + Math.PI/8) * rInner, Math.sin(angle + Math.PI/8) * rInner);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      
      if (t.type === 'icicle') {
        ctx.fillStyle = '#a0e0ff';
        ctx.shadowColor = '#a0e0ff'; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x + t.w / 2, t.y + t.h);
        ctx.lineTo(t.x + t.w, t.y);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
      }

      if (t.type === 'laser') {
        ctx.fillStyle = t.on ? 'rgba(255, 61, 113, 0.8)' : 'rgba(255, 61, 113, 0.1)';
        ctx.shadowColor = '#ff3d71'; ctx.shadowBlur = t.on ? 15 : 0;
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.shadowBlur = 0;
        // Лазерная пушка сверху
        ctx.fillStyle = '#4a5c82';
        ctx.fillRect(t.x - 10, t.y - 10, t.w + 20, 10);
      }
    }

    // Трейл
    for (const p of player.trail) {
      const a = Math.max(0, p.life / 0.3);
      ctx.globalAlpha = a * 0.35; ctx.fillStyle = '#8ec5ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, player.r * (0.4 + 0.6 * a), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawPlayer();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawPlayer() {
    const { x, y, r } = player;
    ctx.save(); ctx.shadowColor = '#8ec5ff'; ctx.shadowBlur = 24;
    const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, 2, x, y, r);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#8ec5ff'); grad.addColorStop(1, '#4a7bd4');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    const lookX = Math.max(-1, Math.min(1, player.vx / 300));
    ctx.fillStyle = '#0b0d16'; ctx.beginPath();
    ctx.arc(x - r * 0.32 + lookX * 3, y - r * 0.1, r * 0.16, 0, Math.PI * 2);
    ctx.arc(x + r * 0.32 + lookX * 3, y - r * 0.1, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now; update(dt); draw(); requestAnimationFrame(loop);
  }

  resize(); initWorld(); requestAnimationFrame(loop);
})();
</script>
</body>
